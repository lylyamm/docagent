[project]
name = "docagent"
version = "0.1.0"
description = "Traduction de PDF avec préservation de la mise en page, RAG et agent LangGraph (climat & énergie)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Lilia Ammarkhodja" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.0",
    "py3langid>=0.4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.12",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
]
vertex = [
    "google-auth[requests]>=2.30",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]
front = [
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/docagent"]
warn_unused_ignores = true  # an ignore that no longer hides anything is reported
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Libraries without type hints: optional extras (local embeddings, Google sign-in) and
# the language detector.
module = ["sentence_transformers", "google", "google.*", "py3langid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: rebuilds whole sample PDFs (about 2 min in all); skip them with -m \"not slow\"",
]
