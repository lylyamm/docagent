[project]
name = "docagent"
version = "0.1.0"
description = "Traduction de PDF avec préservation de la mise en page, RAG et agent LangGraph (climat & énergie)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Lilia Ammarkhodja" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "py3langid>=0.4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
front = [
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
