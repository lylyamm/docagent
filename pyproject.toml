[project]
name = "docagent"
version = "0.1.0"
description = "Traduction de PDF avec préservation de la mise en page, RAG et agent LangGraph (climat & énergie)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Lilia Ammarkhodja" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
