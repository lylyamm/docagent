# Settings of the API on Cloud Run. No secret here: the Mistral key comes from Secret Manager.
LLM_PROVIDER: mistral
LLM_MODEL: open-mistral-nemo
EMBEDDER: e5
AGENT_PROVIDER: vertex
AGENT_MODEL: google/gemini-2.5-pro
TOOLS_PROVIDER: vertex
TOOLS_MODEL: google/gemini-2.5-flash
VERTEX_PROJECT: docagent-lilia
VERTEX_LOCATION: global
AGENT_PRICE_IN_USD: "1.25"
AGENT_PRICE_OUT_USD: "10"
TOOLS_PRICE_IN_USD: "0.30"
TOOLS_PRICE_OUT_USD: "2.50"
# The disk starts empty: index and corpus PDFs are copied from the bucket at start-up
RAG_INDEX_URL: gs://docagent-lilia-index/index
RAG_RAW_URL: gs://docagent-lilia-index/raw
RAG_RAW_DIR: /data/raw
AGENT_TRAJECTORIES_DIR: /data/trajectories