# CI: on every push and pull request, check the code on a clean machine.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install (locked versions)
        run: |
          uv sync --locked --extra vertex
          # Type hints of sentence-transformers for mypy, without torch (2+ GB)
          ST=$(sed -n '/^name = "sentence-transformers"$/{n;s/version = "\(.*\)"/\1/p}' uv.lock)
          uv pip install --no-deps "sentence-transformers==${ST}"

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync mypy

      - name: Tests
        run: uv run --no-sync pytest -q