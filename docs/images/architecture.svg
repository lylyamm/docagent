<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <style>
      .zt { font-size: 17px; font-weight: 700; }
      .zs { font-size: 12.5px; fill: #4B5563; }
      .bt { font-size: 15px; font-weight: 700; fill: #111827; }
      .bs { font-size: 12.5px; fill: #374151; }
      .nx { font-size: 12.5px; fill: #6B7280; font-style: italic; }
      .lb { font-size: 12px; fill: #1F2937; }
      .box { fill: #FFFFFF; stroke-width: 1.6; }
      .next { fill: #FFFFFF; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .ar { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .ard { stroke: #374151; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
      .arg { stroke: #2563EB; stroke-width: 1.8; fill: none; marker-end: url(#ag); }
      .argd { stroke: #2563EB; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ag); }
    </style>
  </defs>

  <rect width="1600" height="840" fill="#FFFFFF"/>
  <text x="30" y="48" font-size="26" font-weight="700" fill="#111827">DocAgent · deployment on Google Cloud</text>
  <text x="30" y="74" font-size="14" fill="#4B5563">Solid: running today. Dashed: next steps. Both services are private; no key is stored in GitHub or in the image.</text>

  <!-- ===== Developer laptop ===== -->
  <rect x="30" y="100" width="270" height="440" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="48" y="128" class="zt" fill="#374151">Developer laptop</text>
  <text x="48" y="147" class="zs">Windows · uv · uv.lock · gcloud</text>
  <rect x="48" y="165" width="234" height="160" rx="10" class="box" stroke="#6B7280"/>
  <text x="62" y="191" class="bt">git commit / push</text>
  <text x="62" y="214" class="bs">pre-commit hooks:</text>
  <text x="62" y="235" class="bs">• ruff check · ruff format</text>
  <text x="62" y="255" class="bs">• mypy (src/docagent)</text>
  <text x="62" y="275" class="bs">• no .env, no private key</text>
  <text x="62" y="295" class="bs">• before push: fast tests</text>
  <text x="62" y="314" class="bs">   (pytest -m "not slow", ~15 s)</text>
  <rect x="48" y="350" width="234" height="96" rx="10" class="box" stroke="#6B7280"/>
  <text x="62" y="376" class="bt">Index build (offline)</text>
  <text x="62" y="399" class="bs">scripts/rag_index.py · e5</text>
  <text x="62" y="419" class="bs">5 public reports → 4,970</text>
  <text x="62" y="436" class="bs">passages + vectors → bucket</text>
  <rect x="48" y="466" width="234" height="56" rx="10" class="box" stroke="#6B7280"/>
  <text x="62" y="490" class="bt">.env (never committed)</text>
  <text x="62" y="510" class="bs">local runs only</text>

  <!-- ===== GitHub ===== -->
  <rect x="330" y="100" width="300" height="440" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="348" y="128" class="zt" fill="#5B21B6">GitHub</text>
  <text x="348" y="147" class="zs">lylyamm/docagent · main protected</text>
  <rect x="348" y="165" width="264" height="150" rx="10" class="box" stroke="#7C3AED"/>
  <text x="362" y="191" class="bt">Actions · CI</text>
  <text x="362" y="212" class="bs">on every push and pull request</text>
  <text x="362" y="236" class="bs">• uv sync (locked versions)</text>
  <text x="362" y="256" class="bs">• ruff check · ruff format --check</text>
  <text x="362" y="276" class="bs">• mypy (with the local + vertex extras)</text>
  <text x="362" y="296" class="bs">• pytest, no network, no key</text>
  <rect x="348" y="355" width="264" height="120" rx="10" class="next" stroke="#7C3AED"/>
  <text x="362" y="381" class="bt">Actions · CD (next)</text>
  <text x="362" y="402" class="bs">on main, after CI</text>
  <text x="362" y="426" class="bs">• Cloud Build: image &lt;git sha&gt;</text>
  <text x="362" y="446" class="bs">• deploy api and front</text>
  <text x="362" y="466" class="bs">• smoke test: GET /health</text>
  <text x="348" y="506" class="nx">Auth to Google Cloud: Workload Identity</text>
  <text x="348" y="524" class="nx">Federation (short-lived token, no JSON key)</text>

  <!-- ===== Google Cloud ===== -->
  <rect x="660" y="100" width="910" height="710" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="678" y="128" class="zt" fill="#1D4ED8">Google Cloud · project docagent-lilia · europe-west9 (Paris)</text>
  <text x="678" y="147" class="zs">pay as you go · scale to zero (min 0 instances) · one service account per service, least privilege</text>

  <rect x="680" y="165" width="250" height="100" rx="10" class="box" stroke="#2563EB"/>
  <text x="694" y="191" class="bt">Cloud Build</text>
  <text x="694" y="213" class="bs">docker build, e5 model baked in</text>
  <text x="694" y="233" class="bs">today: gcloud builds submit</text>
  <text x="694" y="252" class="nx">next: started by the CD</text>

  <rect x="990" y="165" width="310" height="86" rx="10" class="box" stroke="#2563EB"/>
  <text x="1004" y="191" class="bt">Artifact Registry</text>
  <text x="1004" y="213" class="bs">image docagent:&lt;git sha&gt;</text>
  <text x="1004" y="233" class="bs">one image, two services</text>

  <rect x="680" y="335" width="250" height="150" rx="10" class="box" stroke="#2563EB"/>
  <text x="694" y="361" class="bt">Cloud Run · front</text>
  <text x="694" y="383" class="bs">Streamlit: Translate a PDF,</text>
  <text x="694" y="403" class="bs">Ask the reports, Assistant</text>
  <text x="694" y="428" class="bs">min 0 · max 1 · 1 vCPU · 1 GiB</text>
  <text x="694" y="448" class="bs">account docagent-front: may</text>
  <text x="694" y="468" class="bs">only call the api (ID token)</text>

  <rect x="990" y="300" width="310" height="190" rx="10" class="box" stroke="#2563EB" stroke-width="2.4"/>
  <text x="1004" y="327" class="bt">Cloud Run · api</text>
  <text x="1004" y="350" class="bs">FastAPI: /v1/translate, /v1/ask, /v1/agent</text>
  <text x="1004" y="372" class="bs">• LangGraph agent (supervisor, judge)</text>
  <text x="1004" y="392" class="bs">• PDF translator (layout kept)</text>
  <text x="1004" y="412" class="bs">• hybrid search: BM25 + e5 + RRF</text>
  <text x="1004" y="432" class="bs">• Qdrant embedded (no extra service)</text>
  <text x="1004" y="456" class="bs">min 0 · max 1 · 2 vCPU · 4 GiB</text>
  <text x="1004" y="476" class="bs">account docagent-run</text>

  <rect x="1340" y="165" width="210" height="130" rx="10" class="box" stroke="#2563EB"/>
  <text x="1354" y="191" class="bt">Vertex AI (global)</text>
  <text x="1354" y="214" class="bs">Gemini 3.8 Flash:</text>
  <text x="1354" y="232" class="bs">  supervisor, judge</text>
  <text x="1354" y="254" class="bs">Gemini 3.5 Flash-Lite:</text>
  <text x="1354" y="272" class="bs">  tools</text>

  <rect x="1340" y="325" width="210" height="80" rx="10" class="box" stroke="#2563EB"/>
  <text x="1354" y="351" class="bt">Secret Manager</text>
  <text x="1354" y="373" class="bs">MISTRAL_API_KEY</text>
  <text x="1354" y="391" class="nx">LANGFUSE_* keys (next)</text>

  <rect x="1340" y="425" width="210" height="100" rx="10" class="box" stroke="#2563EB"/>
  <text x="1354" y="451" class="bt">Cloud Storage</text>
  <text x="1354" y="473" class="bs">search index + corpus</text>
  <text x="1354" y="491" class="bs">PDFs (~170 MB), copied</text>
  <text x="1354" y="509" class="bs">to disk at start-up</text>

  <rect x="990" y="560" width="310" height="80" rx="10" class="box" stroke="#2563EB"/>
  <text x="1004" y="586" class="bt">Cloud Logging · Monitoring</text>
  <text x="1004" y="608" class="bs">JSON logs, latency, errors,</text>
  <text x="1004" y="626" class="bs">instance starts</text>

  <rect x="990" y="680" width="560" height="110" rx="10" class="next" stroke="#2563EB"/>
  <text x="1008" y="708" class="bt">Terraform (infra/, next): every resource of this box</text>
  <text x="1008" y="732" class="bs">registry · both Cloud Run services · service accounts and IAM</text>
  <text x="1008" y="752" class="bs">Workload Identity pool for GitHub · secret · bucket · budget</text>
  <text x="1008" y="774" class="bs">created by hand today; one command will recreate them</text>

  <!-- ===== Users and outside services ===== -->
  <rect x="30" y="580" width="600" height="230" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="48" y="608" class="zt" fill="#C2410C">Users and outside services</text>
  <rect x="48" y="625" width="234" height="80" rx="10" class="box" stroke="#EA580C"/>
  <text x="62" y="651" class="bt">Developer (today)</text>
  <text x="62" y="673" class="bs">gcloud run services proxy:</text>
  <text x="62" y="691" class="bs">localhost, own Google identity</text>
  <rect x="48" y="720" width="234" height="72" rx="10" class="next" stroke="#EA580C"/>
  <text x="62" y="746" class="bt">Visitors (next)</text>
  <text x="62" y="768" class="bs">IAP: Google sign-in, allowlist</text>
  <rect x="330" y="625" width="282" height="72" rx="10" class="box" stroke="#EA580C"/>
  <text x="344" y="651" class="bt">Mistral API</text>
  <text x="344" y="673" class="bs">open-mistral-nemo: PDF translation</text>
  <rect x="330" y="720" width="282" height="72" rx="10" class="next" stroke="#EA580C"/>
  <text x="344" y="746" class="bt">Langfuse Cloud (EU, next)</text>
  <text x="344" y="768" class="bs">traces, tokens, cost, judge scores</text>

  <!-- ===== Arrows ===== -->
  <!-- laptop -> GitHub CI -->
  <path class="ar" d="M282,230 L346,230"/>
  <text x="290" y="221" class="lb">push</text>
  <!-- CI -> CD (next) -->
  <path class="ard" d="M480,315 L480,353"/>
  <text x="488" y="339" class="lb">green</text>
  <!-- CD -> Cloud Build (next) -->
  <path class="argd" d="M612,395 L645,395 L645,215 L678,215"/>
  <!-- CD -> front (deploy, next) -->
  <path class="argd" d="M612,440 L678,440"/>
  <text x="616" y="432" class="lb" fill="#1D4ED8">deploy</text>
  <!-- Cloud Build -> Artifact Registry -->
  <path class="arg" d="M930,208 L988,208"/>
  <text x="940" y="200" class="lb" fill="#1D4ED8">push</text>
  <!-- Registry -> front (image) -->
  <path class="ard" d="M1020,251 L1020,285 L805,285 L805,333"/>
  <text x="812" y="310" class="lb">image</text>
  <!-- Registry -> api (image) -->
  <path class="ard" d="M1145,251 L1145,298"/>
  <text x="1152" y="280" class="lb">image</text>
  <!-- developer -> front -->
  <path class="ar" d="M282,665 L316,665 L316,562 L760,562 L760,487"/>
  <text x="440" y="556" class="lb">HTTPS + Google identity</text>
  <!-- visitors -> front (next) -->
  <path class="ard" d="M282,756 L316,756 L316,667"/>
  <!-- front -> api -->
  <path class="ar" d="M930,400 L988,400"/>
  <text x="937" y="391" class="lb">REST</text>
  <text x="935" y="418" class="lb">ID token</text>
  <!-- api -> Vertex -->
  <path class="ar" d="M1300,320 L1318,320 L1318,230 L1338,230"/>
  <text x="1210" y="292" class="lb">Gemini, no key</text>
  <!-- api -> Secret Manager -->
  <path class="ar" d="M1300,365 L1338,365"/>
  <!-- Storage -> api -->
  <path class="ar" d="M1338,470 L1302,470"/>
  <!-- api -> Logging -->
  <path class="ar" d="M1145,490 L1145,558"/>
  <text x="1152" y="528" class="lb">logs</text>
  <!-- api -> Mistral -->
  <path class="ar" d="M988,465 L962,465 L962,661 L614,661"/>
  <text x="680" y="653" class="lb">translation requests</text>
  <!-- api -> Langfuse (next) -->
  <path class="ard" d="M988,480 L972,480 L972,756 L614,756"/>
  <text x="680" y="748" class="lb">LLM traces and scores</text>
</svg>
