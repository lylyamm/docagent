<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <style>
      .zt { font-size: 17px; font-weight: 700; }
      .zs { font-size: 12.5px; fill: #4B5563; }
      .bt { font-size: 15px; font-weight: 700; fill: #111827; }
      .bs { font-size: 12.5px; fill: #374151; }
      .lb { font-size: 12px; fill: #1F2937; }
      .box { fill: #FFFFFF; stroke-width: 1.6; }
      .ar { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .ard { stroke: #374151; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
      .arg { stroke: #2563EB; stroke-width: 1.8; fill: none; marker-end: url(#ag); }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#FFFFFF"/>
  <text x="30" y="48" font-size="26" font-weight="700" fill="#111827">DocAgent · target architecture (S5)</text>
  <text x="30" y="74" font-size="14" fill="#4B5563">Every push is tested; main and v* tags are built and deployed to Cloud Run. No key is stored in GitHub or in the image.</text>

  <!-- ===== Developer laptop ===== -->
  <rect x="30" y="100" width="270" height="440" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="48" y="128" class="zt" fill="#374151">Developer laptop</text>
  <text x="48" y="147" class="zs">Windows · uv · uv.lock</text>
  <rect x="48" y="165" width="234" height="160" rx="10" class="box" stroke="#6B7280"/>
  <text x="62" y="191" class="bt">git commit / push</text>
  <text x="62" y="214" class="bs">pre-commit hooks:</text>
  <text x="62" y="235" class="bs">• ruff check · ruff format</text>
  <text x="62" y="255" class="bs">• mypy (src/docagent)</text>
  <text x="62" y="275" class="bs">• no .env, no private key</text>
  <text x="62" y="295" class="bs">• before push: fast tests</text>
  <text x="62" y="314" class="bs">   (pytest -m "not slow", ~15 s)</text>
  <rect x="48" y="350" width="234" height="96" rx="10" class="box" stroke="#6B7280"/>
  <text x="62" y="376" class="bt">Index build (offline)</text>
  <text x="62" y="399" class="bs">scripts/rag_index.py · e5</text>
  <text x="62" y="419" class="bs">5 public reports → 4,970</text>
  <text x="62" y="436" class="bs">passages + vectors</text>
  <rect x="48" y="466" width="234" height="56" rx="10" class="box" stroke="#6B7280"/>
  <text x="62" y="490" class="bt">.env (never committed)</text>
  <text x="62" y="510" class="bs">local runs only</text>

  <!-- ===== GitHub ===== -->
  <rect x="330" y="100" width="300" height="440" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="348" y="128" class="zt" fill="#5B21B6">GitHub</text>
  <text x="348" y="147" class="zs">lylyamm/docagent</text>
  <rect x="348" y="165" width="264" height="150" rx="10" class="box" stroke="#7C3AED"/>
  <text x="362" y="191" class="bt">Actions · CI</text>
  <text x="362" y="212" class="bs">on every push and pull request</text>
  <text x="362" y="236" class="bs">• uv sync (locked versions)</text>
  <text x="362" y="256" class="bs">• ruff check · ruff format --check</text>
  <text x="362" y="276" class="bs">• mypy (with the local + vertex extras)</text>
  <text x="362" y="296" class="bs">• pytest: 278 tests, no network</text>
  <rect x="348" y="355" width="264" height="120" rx="10" class="box" stroke="#7C3AED"/>
  <text x="362" y="381" class="bt">Actions · CD</text>
  <text x="362" y="402" class="bs">on main and tags v*, after CI</text>
  <text x="362" y="426" class="bs">• docker build (e5 baked in)</text>
  <text x="362" y="446" class="bs">• push image · deploy Cloud Run</text>
  <text x="362" y="466" class="bs">• smoke test: GET /health</text>
  <text x="348" y="506" class="zs">Auth to Google Cloud: Workload Identity</text>
  <text x="348" y="524" class="zs">Federation (short-lived token, no JSON key)</text>

  <!-- ===== Google Cloud ===== -->
  <rect x="660" y="100" width="910" height="700" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="678" y="128" class="zt" fill="#1D4ED8">Google Cloud · project projetlilia · europe-west9 (Paris)</text>
  <text x="678" y="147" class="zs">pay as you go · budget 5 € with alert · scale to zero</text>

  <rect x="680" y="165" width="250" height="86" rx="10" class="box" stroke="#2563EB"/>
  <text x="694" y="191" class="bt">Artifact Registry</text>
  <text x="694" y="213" class="bs">image docagent:&lt;git sha&gt;</text>
  <text x="694" y="233" class="bs">API and front end</text>

  <rect x="680" y="335" width="250" height="110" rx="10" class="box" stroke="#2563EB"/>
  <text x="694" y="361" class="bt">Cloud Run · front</text>
  <text x="694" y="383" class="bs">Streamlit: Translate a PDF,</text>
  <text x="694" y="403" class="bs">Ask the reports, Assistant</text>
  <text x="694" y="428" class="bs">min 0 · max 1 instance</text>

  <rect x="990" y="300" width="310" height="190" rx="10" class="box" stroke="#2563EB" stroke-width="2.4"/>
  <text x="1004" y="327" class="bt">Cloud Run · api</text>
  <text x="1004" y="350" class="bs">FastAPI: /v1/translate, /v1/ask, /v1/agent</text>
  <text x="1004" y="372" class="bs">• LangGraph agent (supervisor, judge)</text>
  <text x="1004" y="392" class="bs">• PDF translator (layout kept)</text>
  <text x="1004" y="412" class="bs">• hybrid search: BM25 + e5 + RRF</text>
  <text x="1004" y="432" class="bs">• Qdrant embedded (no extra service)</text>
  <text x="1004" y="456" class="bs">min 0 · max 1 instance · 2 vCPU · 4 GiB</text>
  <text x="1004" y="476" class="bs">service account docagent-run</text>

  <rect x="1340" y="165" width="210" height="110" rx="10" class="box" stroke="#2563EB"/>
  <text x="1354" y="191" class="bt">Vertex AI (global)</text>
  <text x="1354" y="214" class="bs">Gemini 2.5 Pro:</text>
  <text x="1354" y="232" class="bs">  supervisor, judge</text>
  <text x="1354" y="252" class="bs">Gemini 2.5 Flash: tools</text>

  <rect x="1340" y="315" width="210" height="80" rx="10" class="box" stroke="#2563EB"/>
  <text x="1354" y="341" class="bt">Secret Manager</text>
  <text x="1354" y="363" class="bs">MISTRAL_API_KEY</text>
  <text x="1354" y="381" class="bs">LANGFUSE_* keys</text>

  <rect x="1340" y="425" width="210" height="90" rx="10" class="box" stroke="#2563EB"/>
  <text x="1354" y="451" class="bt">Cloud Storage</text>
  <text x="1354" y="473" class="bs">search index (~20 MB)</text>
  <text x="1354" y="493" class="bs">read at start-up</text>

  <rect x="990" y="560" width="310" height="80" rx="10" class="box" stroke="#2563EB"/>
  <text x="1004" y="586" class="bt">Cloud Logging · Monitoring</text>
  <text x="1004" y="608" class="bs">JSON logs, latency, errors,</text>
  <text x="1004" y="626" class="bs">instance count</text>

  <rect x="990" y="670" width="560" height="110" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1008" y="698" class="bt">Terraform (infra/): every resource of this box</text>
  <text x="1008" y="722" class="bs">registry · both Cloud Run services · service accounts and IAM</text>
  <text x="1008" y="742" class="bs">Workload Identity pool for GitHub · secrets · bucket · budget</text>
  <text x="1008" y="764" class="bs">one command recreates them; nothing is clicked by hand</text>

  <!-- ===== Outside services and users ===== -->
  <rect x="30" y="580" width="600" height="220" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="48" y="608" class="zt" fill="#C2410C">Users and outside services</text>
  <rect x="48" y="625" width="234" height="80" rx="10" class="box" stroke="#EA580C"/>
  <text x="62" y="651" class="bt">Visitor (browser)</text>
  <text x="62" y="673" class="bs">demo link (HTTPS)</text>
  <text x="62" y="691" class="bs">access to decide</text>
  <rect x="330" y="625" width="282" height="72" rx="10" class="box" stroke="#EA580C"/>
  <text x="344" y="651" class="bt">Mistral API</text>
  <text x="344" y="673" class="bs">open-mistral-nemo: PDF translation</text>
  <rect x="330" y="712" width="282" height="72" rx="10" class="box" stroke="#EA580C"/>
  <text x="344" y="738" class="bt">Langfuse Cloud (EU)</text>
  <text x="344" y="760" class="bs">traces, tokens, cost, judge scores</text>

  <!-- ===== Arrows ===== -->
  <!-- laptop -> GitHub CI -->
  <path class="ar" d="M282,230 L346,230"/>
  <text x="290" y="221" class="lb">push</text>
  <!-- CI -> CD -->
  <path class="ar" d="M480,315 L480,353"/>
  <text x="488" y="339" class="lb">green</text>
  <!-- CD -> Artifact Registry -->
  <path class="arg" d="M612,390 L645,390 L645,208 L678,208"/>
  <!-- CD -> front (deploy both services) -->
  <path class="arg" d="M612,430 L678,430"/>
  <text x="616" y="422" class="lb" fill="#1D4ED8">deploy</text>
  <text x="616" y="382" class="lb" fill="#1D4ED8">push</text>
  <!-- Registry -> front (image) -->
  <path class="ard" d="M805,251 L805,333"/>
  <text x="812" y="297" class="lb">image</text>
  <!-- Registry -> api (image + deploy) -->
  <path class="ard" d="M930,230 L1100,230 L1100,298"/>
  <text x="975" y="222" class="lb">image, new revision</text>
  <!-- Visitor -> front -->
  <path class="ar" d="M282,665 L316,665 L316,560 L760,560 L760,447"/>
  <text x="560" y="553" class="lb">HTTPS</text>
  <!-- front -> api -->
  <path class="ar" d="M930,390 L988,390"/>
  <text x="937" y="381" class="lb">REST</text>
  <!-- api -> Vertex -->
  <path class="ar" d="M1300,320 L1318,320 L1318,220 L1338,220"/>
  <text x="1222" y="292" class="lb">Gemini, no key</text>
  <!-- api -> Secret Manager -->
  <path class="ar" d="M1300,355 L1338,355"/>
  <!-- Storage -> api -->
  <path class="ar" d="M1338,470 L1302,470"/>
  <!-- api -> Logging -->
  <path class="ar" d="M1145,490 L1145,558"/>
  <text x="1152" y="528" class="lb">logs</text>
  <!-- api -> Mistral -->
  <path class="ar" d="M988,465 L962,465 L962,661 L614,661"/>
  <text x="680" y="653" class="lb">translation requests</text>
  <!-- api -> Langfuse -->
  <path class="ar" d="M988,480 L972,480 L972,748 L614,748"/>
  <text x="680" y="740" class="lb">LLM traces and scores</text>
</svg>
