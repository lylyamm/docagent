# docker compose up --build   ->  front on http://localhost:8501, API on http://localhost:8000/docs
# Without a .env file the API runs with TRANSLATOR=fake (layout demo, no key needed).

services:
  api:
    build: .
    image: docagent:latest
    env_file:
      - path: .env
        required: false
    environment:
      TRANSLATOR: ${TRANSLATOR:-llm}
    ports:
      - "8000:8000"
    volumes:
      - docagent-data:/data
    restart: unless-stopped

  front:
    image: docagent:latest
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "front/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      DOCAGENT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  docagent-data:
